sonar.projectKey=todo-list
sonar.projectName=Todo List API
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.spec.ts
sonar.exclusions=dist/**,node_modules/**,coverage/**
sonar.coverage.exclusions=src/main.ts,src/AppModule.ts,src/**/**Module.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
